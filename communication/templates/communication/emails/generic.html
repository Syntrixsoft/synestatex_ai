{% extends "communication/emails/base.html" %}

{% block content %}
{% if heading %}
<h1 style="margin:0 0 16px;font-size:22px;">{{ heading }}</h1>
{% endif %}
{% if preheader %}
<p style="margin:0 0 16px;font-size:16px;">{{ preheader }}</p>
{% endif %}
{% if body_html %}
{{ body_html|safe }}
{% else %}
<p style="margin:0;font-size:16px;line-height:24px;white-space:pre-line;">{{ body }}</p>
{% endif %}
{% endblock %}
